name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: inventory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://inventory:ci-only-password@127.0.0.1:5432/inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: Lockfile is in sync with pyproject.toml
        # Seed the output with the committed lockfile so uv keeps its pins: the check then fails only when
        # pyproject.toml changes, not whenever a dependency publishes a new release.
        run: |
          cp requirements/dev.txt /tmp/dev.txt
          uv pip compile pyproject.toml --group dev --universal --python-version 3.12 --generate-hashes -o /tmp/dev.txt -q
          diff <(grep -v '^#' requirements/dev.txt) <(grep -v '^#' /tmp/dev.txt)
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - name: Alembic models and migrations agree
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head && alembic check
      - run: pytest --cov --cov-report=term --cov-fail-under=85
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit --require-hashes --disable-pip -r requirements/prod.txt

  container:
    name: docker build + end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
          } > .env
          echo "ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Build image
        run: docker compose build
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id inventory-api:local -u)" = "10001"
      - name: Start stack and wait for readiness
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Bootstrap admin
        run: |
          docker compose run --rm -e ADMIN_PASSWORD="$ADMIN_PASSWORD" api \
            python -m app.cli create-admin --email admin@example.com --full-name "CI Admin"
      - name: Smoke test
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8000
          SMOKE_ADMIN_EMAIL: admin@example.com
          SMOKE_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          python -m pip install httpx
          python scripts/smoke_test.py
      - name: Graceful shutdown within grace period
        run: |
          start=$(date +%s)
          docker compose stop api
          test $(( $(date +%s) - start )) -lt 25
          docker compose logs api | tail -5
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
