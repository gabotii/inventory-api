[project]
name = "inventory-api"
version = "1.0.0"
description = "Multi-warehouse inventory management REST API (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    # Explicit extras instead of uvicorn[standard]: no file watcher / websockets in production.
    "uvicorn>=0.32",
    "httptools>=0.6",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "uv>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "N",
    "DTZ", "T20", "RET", "PL", "TRY", "PERF", "LOG", "G",
]
ignore = [
    "PLR0913",  # FastAPI handlers legitimately take many injected params
    "PLR2004",  # magic values in comparisons are fine in tests / HTTP codes
    "TRY003",   # long messages in exception constructors are intended
    "B008",     # FastAPI Depends() in defaults is the framework idiom
    "PLR0917",  # same: injected handler params are positional-or-keyword
]

[tool.ruff.lint.isort]
# The local "alembic/" migrations folder must not make the alembic package first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311"]
"alembic/**" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a real PostgreSQL database (TEST_DATABASE_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy asyncio runs ORM code inside greenlets; trace them too.
concurrency = ["greenlet", "thread"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
